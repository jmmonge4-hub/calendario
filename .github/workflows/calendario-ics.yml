# Cada 6 horas copia tus guardias del portal (planif.json) y genera calendario.ics con ellas, turnos y notas,
# para que Google Calendar lo lea por suscripción.
name: Actualizar calendario.ics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copiar guardias del portal (solo lectura)
        env:
          PORTAL_FIREBASE_SA: ${{ secrets.PORTAL_FIREBASE_SA }}
        run: |
          pip install -q google-auth requests
          python3 .github/exportar_portal.py
      - name: Generar calendario.ics
        run: python3 .github/generar_ics.py
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendario.ics; for f in planif.json personal.json; do [ -f "$f" ] && git add "$f"; done
          # Solo cambia la marca de hora si no hay cambios reales: no se guarda
          if git diff --cached --quiet -I '^DTSTAMP:'; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar calendario.ics"
          git push
